name: Deploy production

# CICD-003: production deploys only from main, only after CI passed, and
# migrations are applied before the app version that needs them goes live.
# Preview deployments come from Vercel's Git integration (production
# auto-deploys from main are disabled in vercel.json).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply database migrations
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # The `production` environment requires a reviewer's approval (GitHub →
    # Settings → Environments) and holds the secrets below.
    environment: production
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      # DATA-003: the production schema must equal what the migrations
      # already applied there produce. Anything else is a dashboard edit.
      - name: Drift check (production vs applied migrations)
        run: |
          success=0
          for attempt in 1 2 3; do
            : > /tmp/cli-err
            : > /tmp/node-err
            if raw=$(npx supabase migration list --linked --output-format json 2>/tmp/cli-err); then
              if applied=$(printf '%s' "$raw" | node -e '
                let s="";
                process.stdin.on("data",d=>s+=d).on("end",()=>{
                  let parsed;
                  try { parsed = JSON.parse(s); } catch (e) { console.error("Could not parse migration list JSON: " + e.message); process.exit(1); }
                  if (!Array.isArray(parsed.migrations)) { console.error("Unexpected shape, no migrations array: " + JSON.stringify(parsed).slice(0,500)); process.exit(1); }
                  console.log(parsed.migrations.filter(x=>x.remote&&!x.local).map(x=>x.remote).join(" "));
                });
              ' 2>/tmp/node-err); then
                success=1
                break
              fi
            fi
            echo "Attempt $attempt/3 to read migration status from production failed."
            echo "--- supabase CLI stderr ---"; cat /tmp/cli-err
            echo "--- parser stderr ---"; cat /tmp/node-err
            echo "--- raw output (first 1000 chars) ---"; printf '%s' "${raw:-}" | head -c 1000; echo
            if [ "$attempt" -lt 3 ]; then echo "Retrying in 5s..."; sleep 5; fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Giving up after 3 attempts to read migration status from production."
            exit 1
          fi
          if [ -n "$applied" ]; then echo "Production has migrations that are not in the repo: $applied"; exit 1; fi
      - name: Apply pending migrations
        run: npx supabase db push --linked --yes
      - name: Schema drift after push must be empty
        run: |
          drift=$(npx supabase db diff --linked --schema public)
          if [ -n "$drift" ]; then echo "$drift"; echo "Production schema differs from migrations (dashboard edit?)."; exit 1; fi

  deploy:
    name: Deploy app to Vercel production
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm i -g vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --env RELEASE_SHA=${{ github.event.workflow_run.head_sha }})
          echo "Deployed $url"
      - name: Smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "${{ vars.PRODUCTION_URL }}/api/health") && echo "$body" | grep -q '"ok":true' && echo "$body" && exit 0
            sleep 10
          done
          echo "Production health check failed after deploy"; exit 1
